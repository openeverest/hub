name: bump-chart-versions

# Daily bot that watches the OCI chart repositories referenced by every public
# formula.yaml and opens an isolated pull request for each extension whose
# pinned chart version is behind the newest published stable release.
#
# One PR per extension/channel keeps upgrades independent: a maintainer can
# merge the providers that are ready and leave the rest, without one lagging
# chart blocking everything else.

on:
  schedule:
    # 07:23 UTC daily (off the hour to avoid GitHub's cron congestion).
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: bump-chart-versions
  cancel-in-progress: false

jobs:
  bump:
    name: Open version-bump PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Install oras
        run: |
          ORAS_VERSION=1.2.0
          curl -fsSL -o oras.tar.gz \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          sudo tar -xzf oras.tar.gz -C /usr/local/bin oras
          rm oras.tar.gz
          oras version

      - name: Authenticate oras to ghcr.io
        # Anonymous pulls of public packages work, but logging in with the
        # workflow token avoids unauthenticated rate limits.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | oras login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Detect available chart updates
        id: detect
        run: |
          bash .github/scripts/check-chart-updates.sh > updates.json
          count=$(jq 'length' updates.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count update(s)."
          jq -r '.[] | "  \(.name) [\(.channel)]: \(.current) -> \(.latest)"' updates.json

      - name: Open one pull request per update
        if: steps.detect.outputs.count != '0'
        env:
          # Prefer a PAT (HUB_BOT_TOKEN) so the resulting PRs trigger the
          # validate / verify-charts checks. GITHUB_TOKEN also works, but PRs
          # it creates do not start other workflow runs.
          GH_TOKEN: ${{ secrets.HUB_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name  openeverest-hub-bot
          git config user.email hub-bot@openeverest.io

          base_branch="${GITHUB_REF_NAME}"

          jq -c '.[]' updates.json | while read -r update; do
            name=$(jq -r '.name'    <<< "$update")
            path=$(jq -r '.path'    <<< "$update")
            channel=$(jq -r '.channel' <<< "$update")
            current=$(jq -r '.current' <<< "$update")
            latest=$(jq -r '.latest'  <<< "$update")

            branch="bot/bump-${name}-${channel}-${latest}"
            title="chore(${name}): bump ${channel} chart ${current} -> ${latest}"

            # Skip if a PR for this exact bump already exists (open or merged),
            # or if the branch is already present on the remote.
            if gh pr list --state all --head "$branch" --json number \
                 --jq 'length' | grep -qv '^0$'; then
              echo "skip   $name: PR for $branch already exists"
              continue
            fi
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "skip   $name: branch $branch already on remote"
              continue
            fi

            # Build each PR from a clean base so bumps stay isolated.
            git checkout -B "$branch" "origin/${base_branch}"

            channel="$channel" latest="$latest" \
              yq -i '.spec.artifacts.chart.channels.[strenv(channel)].version = strenv(latest)' "$path"

            if git diff --quiet -- "$path"; then
              echo "skip   $name: no change written to $path"
              git checkout "$base_branch"
              continue
            fi

            git add "$path"
            git commit -m "$title"
            git push --set-upstream origin "$branch"

            body=$(printf '%s\n' \
              "Automated chart version bump detected by the \`bump-chart-versions\` workflow." \
              "" \
              "| Extension | Channel | Current | Latest |" \
              "| --- | --- | --- | --- |" \
              "| \`${name}\` | \`${channel}\` | \`${current}\` | \`${latest}\` |" \
              "" \
              "Source: \`${path}\`" \
              "" \
              "The \`index/index.json\` is regenerated automatically on merge to \`main\`, so only the formula is changed here.")

            # --label is best-effort: retry without it if the label is missing.
            gh pr create --base "$base_branch" --head "$branch" \
              --title "$title" --body "$body" --label dependencies 2>/dev/null \
              || gh pr create --base "$base_branch" --head "$branch" \
                   --title "$title" --body "$body"

            echo "opened $name: $branch"
            git checkout "$base_branch"
          done
