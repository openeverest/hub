apiVersion: hub.openeverest.io/v1
kind: Extension
metadata:
  name: foxtrot
  type: plugin
  displayName: "foxtrot"
  description: Test fixture.
  license: Apache-2.0
  maintainers:
    - github: openeverest
spec:
  plugin:
    contributes:
      ui: true
  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://registry.test/charts/foxtrot
          version: latest
  install:
    helm:
      releaseName: foxtrot
      namespace: everest-system
