# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: monitoring-victoriametrics
  type: integration
  displayName: "VictoriaMetrics"
  icon: ./victoriametrics-icon.svg
  description: |
    Send the metrics of OpenEverest database instances to a VMAgent run by
    the VictoriaMetrics Operator. Installs the `victoriametrics` MonitoringClass
    and a controller that renders one VMPodScrape per database component from
    the metrics endpoints the provider publishes.
  categories:
    - monitoring
    - observability
  keywords:
    - victoriametrics
    - victoriametrics-operator
    - vmpodscrape
    - metrics
  homepage: https://github.com/openeverest/monitoring-victoriametrics
  sourceRepo: https://github.com/openeverest/monitoring-victoriametrics
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  integration:
    area: monitoring
    monitoring:
      classes: [victoriametrics]
      executionModes: [ExtensionManaged]
      requires:
        metrics: true

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/monitoring-victoriametrics
          version: "0.1.0"

  install:
    helm:
      releaseName: monitoring-victoriametrics
      namespace: everest-system
    prerequisites:
      - name: VictoriaMetrics Operator
        description: "Renders the generated VMPodScrapes; a VMAgent must select them."
        installUrl: https://docs.victoriametrics.com/operator/quick-start/
