# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: percona-server-mysql
  type: provider
  displayName: "MySQL (PS)"
  icon: ./ps.png
  description: |
    Highly available MySQL clusters powered by the Percona Operator for MySQL
    based on Percona Server for MySQL, with async replication and MySQL
    Group Replication topologies.
  categories:
    - database
    - mysql
  keywords:
    - mysql
    - percona
    - group-replication
    - async-replication
    - orchestrator
  homepage: https://github.com/openeverest/provider-percona-server-mysql
  sourceRepo: https://github.com/openeverest/provider-percona-server-mysql
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  provider:
    providerName: percona-server-mysql
    supportedEngines:
      - mysql

  compatibility:
    openeverest: ">=2.0.0-dev.4"

  capabilities:
    ha: true
    monitoring: true
    backups: true
    pitr: false
    encryption: true
    topologies: ["async", "groupreplication"]
    versions: ["8.0", "8.4"]
    proxy: ["haproxy", "router"]

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-percona-server-mysql
          version: "0.2.0"

  install:
    helm:
      releaseName: provider-percona-server-mysql
      namespace: everest-system

