# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: mariadb
  type: provider
  displayName: "MariaDB"
  icon: ./mariadb-icon.svg
  description: |
    MariaDB on Kubernetes, backed by the mariadb-operator. Runs standalone,
    replication and Galera topologies with TLS, MaxScale, scheduled backups
    with point-in-time recovery, scaling, version upgrades, custom my.cnf
    configuration, and optional Prometheus monitoring.
  categories:
    - database
    - mariadb
  keywords:
    - mariadb
    - mysql
    - relational
    - sql
  homepage: https://github.com/openeverest/provider-mariadb
  sourceRepo: https://github.com/openeverest/provider-mariadb
  license: Apache-2.0
  maturity: beta
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  provider:
    providerName: mariadb
    supportedEngines:
      - mariadb

  compatibility:
    openeverest: ">=2.0.0-dev.4"
    kubernetes: ">=1.30 <1.35"

  capabilities:
    ha: true
    monitoring: true
    backups: true
    pitr: true
    encryption: true
    topologies: ["standalone", "replication", "galera"]
    versions: ["10.11", "11.4", "11.8", "12.3"]
    proxy: ["maxscale"]

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-mariadb
          version: "0.2.1"

  install:
    helm:
      releaseName: provider-mariadb
      namespace: everest-system
