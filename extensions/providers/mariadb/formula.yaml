# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: mariadb
  type: provider
  displayName: "MariaDB"
  icon: ./mariadb-icon.svg
  description: |
    MariaDB on Kubernetes, backed by the mariadb-operator. Runs standalone
    instances with provisioning, horizontal and vertical scaling, version
    upgrades, custom my.cnf configuration, and optional Prometheus monitoring.
  categories:
    - database
    - mariadb
  keywords:
    - mariadb
    - mysql
    - relational
    - sql
  homepage: https://github.com/openeverest/provider-mariadb
  sourceRepo: https://github.com/openeverest/provider-mariadb
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  provider:
    providerName: mariadb
    supportedEngines:
      - mariadb

  compatibility:
    openeverest: ">=2.0.0"
    kubernetes: ">=1.30 <1.35"

  capabilities:
    monitoring: true
    scaling.horizontal: true
    scaling.vertical: true
    topologies: ["standalone"]
    mariadb.versions: ["11.4", "11.8"]

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-mariadb
          version: "0.1.3"

  install:
    helm:
      releaseName: provider-mariadb
      namespace: everest-system
