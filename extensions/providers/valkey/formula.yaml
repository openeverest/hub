# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension
metadata:
  name: valkey
  type: provider
  displayName: "Valkey"
  icon: ./valkey_icon.png
  description: |
    Valkey clusters powered by the Valkey Kubernetes Operator.
    Supports replication and sharded cluster topologies. Very early stage.
  categories:
    - database
    - valkey
  keywords:
    - valkey
    - key-value
    - cache
    - redis-compatible
  homepage: https://github.com/openeverest/provider-valkey
  sourceRepo: https://github.com/openeverest/provider-valkey
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"
spec:
  provider:
    providerName: valkey
    supportedEngines:
      - valkey
  compatibility:
    openeverest: ">=2.0.0"
  capabilities:
    ha: true
    sharding: true
    backups: false
    monitoring: false
  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-valkey
          version: "0.1.4"
  install:
    helm:
      releaseName: provider-valkey
      namespace: everest-system
