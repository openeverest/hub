# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension
metadata:
  name: seaweedfs
  type: provider
  displayName: "SeaweedFS"
  icon: ./seaweedfs-icon.svg
  description: |
    Distributed object storage with an S3-compatible gateway on Kubernetes,
    backed by the seaweedfs-operator. Provisions master, volume, filer, and
    S3 components. Early-stage (MVP): not for production use.
  categories:
    - storage
    - object-storage
    - seaweedfs
  keywords:
    - seaweedfs
    - s3
    - object-storage
    - distributed-storage
  homepage: https://github.com/openeverest/provider-seaweedfs
  sourceRepo: https://github.com/openeverest/provider-seaweedfs
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"
spec:
  provider:
    providerName: provider-seaweedfs
    supportedEngines:
      - seaweedfs
  compatibility:
    openeverest: ">=2.0.0-dev.4"
    kubernetes: ">=1.30 <1.35"
  capabilities:
    ha: true
    scaling.horizontal: true
    scaling.vertical: false
    storage.expansion: false
    backups: false
    restores: false
    monitoring: false
    tls: false
    topologies: ["standalone"]
    seaweedfs.versions: ["4.47"]
  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-seaweedfs
          version: "0.1.2"
  install:
    helm:
      releaseName: provider-seaweedfs
      namespace: everest-system
