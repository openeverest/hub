# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: milvus
  type: provider
  displayName: "Milvus"
  icon: ./milvus-icon.svg
  description: |
    Milvus vector database on Kubernetes, backed by the Milvus Operator.
    Supports standalone and cluster topologies with horizontal and vertical
    scaling, version upgrades, and persistent storage.
  categories:
    - database
    - milvus
  keywords:
    - milvus
    - vector-database
    - ai
    - embeddings
  homepage: https://github.com/openeverest/provider-milvus
  sourceRepo: https://github.com/openeverest/provider-milvus
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  provider:
    providerName: milvus
    supportedEngines:
      - milvus

  compatibility:
    openeverest: ">=2.0.0"
    kubernetes: ">=1.30 <1.35"

  capabilities:
    scaling.horizontal: true
    scaling.vertical: true
    topologies: ["standalone", "cluster"]
    milvus.versions: ["2.6"]

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-milvus
          version: "0.1.0"

  install:
    helm:
      releaseName: provider-milvus
      namespace: everest-system
