# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension
metadata:
  name: milvus
  type: provider
  displayName: "Milvus"
  icon: ./milvus.png
  description: |
    Milvus vector database on Kubernetes, backed by the Milvus Operator.
    Early-stage (pre-alpha): standalone and cluster topologies with bundled
    or external etcd, object storage and Pulsar, scaling, version upgrades
    and pod scheduling. Backups, TLS and monitoring are not yet supported.
  categories:
    - database
    - vector
    - ai
  keywords:
    - milvus
    - vector-database
    - similarity-search
    - embeddings
  homepage: https://github.com/openeverest/provider-milvus
  sourceRepo: https://github.com/openeverest/provider-milvus
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"
spec:
  provider:
    providerName: milvus
    supportedEngines:
      - milvus
  compatibility:
    openeverest: ">=2.0.0-dev.4"
    kubernetes: ">=1.30 <1.35"
  capabilities:
    ha: true
    scaling.horizontal: true
    scaling.vertical: true
    storage.expansion: true
    exposure: ["ClusterIP", "NodePort", "LoadBalancer"]
    scheduling: true
    # Not yet supported — see README.
    backups: false
    restores: false
    pitr: false
    monitoring: false
    tls: false
    topologies: ["standalone", "cluster"]
    milvus.versions: ["2.6"]
  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-milvus
          version: "0.1.1"
  install:
    helm:
      releaseName: provider-milvus
      namespace: everest-system
