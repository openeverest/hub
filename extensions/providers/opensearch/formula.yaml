# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension
metadata:
  name: opensearch
  type: provider
  displayName: "OpenSearch"
  icon: ./opensearch_icon.svg
  description: |
    OpenSearch clusters powered by the OpenSearch Kubernetes Operator.
    Supports the standard topology, optional OpenSearch Dashboards, TLS
    everywhere, and S3-compatible snapshot backups and restore.
  categories:
    - database
    - opensearch
    - search
  keywords:
    - search
    - analytics
    - elasticsearch
    - dashboards
  homepage: https://github.com/openeverest/provider-opensearch
  sourceRepo: https://github.com/openeverest/provider-opensearch
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"
spec:
  provider:
    providerName: opensearch
    supportedEngines:
      - opensearch
  compatibility:
    openeverest: ">=2.0.0-dev.3"
  capabilities:
    ha: true
    monitoring: false
    backups: true
    pitr: false
    encryption: true
    topologies: ["standard"]
    versions: ["3.7", "3.8"]
  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-opensearch
          version: "0.1.0"
  install:
    helm:
      releaseName: provider-opensearch
      namespace: everest-system
