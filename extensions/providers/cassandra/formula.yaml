# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension
metadata:
  name: cassandra
  type: provider
  displayName: "Apache Cassandra"
  icon: ./apache-cassandra-icon.png
  description: |
    Apache Cassandra on Kubernetes, backed by the k8ssandra-operator.
    Early-stage (pre-alpha): single-datacenter provisioning, scaling,
    version upgrades, and on-demand and scheduled backup/restore via Medusa.
    PITR, TLS and monitoring are not yet supported.
  categories:
    - database
    - cassandra
  keywords:
    - cassandra
    - nosql
    - wide-column
    - k8ssandra
  homepage: https://github.com/openeverest/provider-cassandra
  sourceRepo: https://github.com/openeverest/provider-cassandra
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"
spec:
  provider:
    providerName: provider-cassandra
    supportedEngines:
      - cassandra
  compatibility:
    openeverest: ">=2.0.0-dev.4"
    kubernetes: ">=1.30 <1.35"
  capabilities:
    ha: true
    monitoring: false
    backups: true
    pitr: false
    encryption: false
    topologies: ["singleDatacenter"]
    versions: ["4.1", "5.0"]
  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-cassandra
          version: "0.1.3"
  install:
    helm:
      releaseName: provider-cassandra
      namespace: everest-system
