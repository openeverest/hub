# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: mssql
  type: provider
  displayName: "Microsoft SQL Server"
  icon: ./mssql_icon.png
  description: |
    Microsoft SQL Server on Kubernetes, provided by Solanica. Runs standalone
    instances and Always On availability groups with automated backups and
    restores. Commercial, gated extension — contact Solanica for access.
  categories:
    - database
    - mssql
  keywords:
    - mssql
    - sqlserver
    - sql-server
    - microsoft
    - relational
  homepage: https://solanica.io/mssql-on-kubernetes
  license: EULA
  maturity: alpha
  access: gated
  maintainers:
    - name: "Solanica"
      email: "sales@solanica.io"
      github: "solanicaio"

spec:
  provider:
    providerName: mssql
    supportedEngines:
      - mssql

  compatibility:
    openeverest: ">=2.0.0-dev.4"

  capabilities:
    ha: true
    ha.topologies: [availabilityGroup]
    backups: true
    restores: true
    monitoring: true

  # Gated access: this extension is listed for discovery only. Installation
  # requires contacting Solanica for a commercial license and private
  # registry credentials — no chart reference or install command is published.
  gated:
    provider: "Solanica"
    contactUrl: "https://solanica.io/contact-us?utm_source=hub-mssql"
    instructions: "Commercial license required. Contact Solanica to request access, licensing, and private registry credentials."
