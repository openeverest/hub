# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: cloudnative-pg
  type: provider
  displayName: "PostgreSQL (CNPG)"
  icon: ./cnpg_icon.svg
  description: |
    Highly available PostgreSQL clusters powered by the CloudNativePG
    operator. Supports replica-set topologies with bootstrap, managed roles,
    and PostgreSQL tuning.
  categories:
    - database
    - postgresql
  keywords:
    - postgresql
    - postgres
    - cloudnative-pg
    - cnpg
    - ha
  homepage: https://github.com/openeverest/provider-cloudnative-pg
  sourceRepo: https://github.com/openeverest/provider-cloudnative-pg
  license: Apache-2.0
  maturity: beta
  maintainers:
    - name: "Aditya Pimpalkar"
      github: "adityapimpalkar"

spec:
  provider:
    providerName: provider-cloudnative-pg
    supportedEngines:
      - postgresql

  compatibility:
    openeverest: "2.0.0-alpha.1"

  capabilities:
    ha: true
    monitoring: true
    backups: true
    pitr: true
    encryption: true
    topologies: ["replicaSet"]
    versions: ["14", "15", "16", "17", "18"]
    proxy: ["pgbouncer"]
    postgresExtensions: ["pgvector", "postgis", "timescaledb"]

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-cloudnative-pg
          version: "0.4.0"

  install:
    prerequisites:
      - name: cert-manager
        description: "Required by this provider."
        installUrl: https://cert-manager.io/docs/installation/helm/
    helm:
      releaseName: provider-cloudnative-pg
      namespace: everest-system
