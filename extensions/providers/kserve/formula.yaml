# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: kserve
  type: provider
  displayName: "KServe"
  icon: ./kserve-logo.png
  description: |
    Serve machine-learning and LLM models on Kubernetes with KServe. Supports
    generative LLM serving (vLLM) and predictive model serving, with GPU
    scheduling, autoscaling, and a curated model catalog.
  categories:
    - ai
    - machine-learning
    - model-serving
  keywords:
    - kserve
    - vllm
    - llm
    - inference
    - model-serving
    - gpu
  homepage: https://github.com/openeverest/provider-kserve
  sourceRepo: https://github.com/openeverest/provider-kserve
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  provider:
    providerName: provider-kserve
    supportedEngines:
      - vllm
      - modelServer

  compatibility:
    openeverest: ">=2.0.0"

  capabilities:
    gpu: true
    autoscaling: true
    monitoring: true
    tls: true
    topologies: ["llm", "predictor"]
    modelSources: ["hf", "s3", "gs", "pvc", "oci"]
    kserve.versions: ["0.20"]

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-kserve
          version: "0.1.2"

  install:
    prerequisites:
      - name: cert-manager
        description: "The KServe controllers run admission webhooks whose certificates cert-manager issues; its CRDs must be present. The chart bundles cert-manager by default — install with cert-manager.enabled=false when the cluster already provides it."
        installUrl: https://cert-manager.io/docs/installation/helm/
    helm:
      releaseName: provider-kserve
      namespace: everest-system
