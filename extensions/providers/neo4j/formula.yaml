# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: neo4j
  type: provider
  displayName: "Neo4j"
  icon: ./neo4j-icon.svg
  description: |
    The Neo4j graph database on Kubernetes, backed by the Neo4j Kubernetes
    Operator. Community standalone servers, and Enterprise clusters with
    analytics and read pools, TLS by default, online backups to S3-compatible
    storage, restores, and Prometheus metrics. Enterprise features need you
    to accept the Neo4j Enterprise license.
  categories:
    - database
    - graph
  keywords:
    - neo4j
    - graph
    - cypher
    - nosql
  homepage: https://openeverest.io/for/neo4j/
  sourceRepo: https://github.com/openeverest/provider-neo4j
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  provider:
    providerName: neo4j
    supportedEngines:
      - neo4j

  capabilities:
    ha: true
    monitoring: true
    backups: true
    pitr: false
    encryption: true
    topologies: ["standalone", "cluster"]
    versions: ["5.26", "2026.05", "2026.06", "2026.07"]

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/provider-neo4j
          version: "0.1.1"

  install:
    helm:
      releaseName: provider-neo4j
      namespace: everest-system
