# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: plugin-user-management
  type: plugin
  displayName: "User Management"
  icon: ./users-icon.svg
  description: |
    Adds a Users tab to database instance pages to create database users and
    manage their roles, so teams stop sharing the admin account. Users are
    InstanceUser resources reconciled into the database, with generated
    credentials stored in a Secret applications can mount. For models on the
    Envoy AI Gateway, the same users are per-application API keys.
  categories:
    - security
    - access-management
    - database
  keywords:
    - users
    - roles
    - credentials
    - api-keys
    - mongodb
    - postgresql
    - kserve
  homepage: https://github.com/openeverest/plugin-user-management
  sourceRepo: https://github.com/openeverest/plugin-user-management
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  plugin:
    contributes:
      ui: true
      backend: true
      cli: false
    extensionPoints:
      - clusterDetailTab

  compatibility:
    openeverest: ">=2.0.0-dev.4"

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/plugin-user-management
          version: "0.2.1"

  install:
    helm:
      releaseName: plugin-user-management
      namespace: everest-system
