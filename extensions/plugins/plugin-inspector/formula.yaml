# yaml-language-server: $schema=../../../schemas/formula-v1.json
apiVersion: hub.openeverest.io/v1
kind: Extension

metadata:
  name: plugin-inspector
  type: plugin
  displayName: "Inspector"
  icon: ./inspector-icon.svg
  description: |
    Adds an Inspector tab to database cluster detail pages. See the pods behind
    an instance as a diagram or table, stream container logs, and describe a
    pod with its containers, conditions and events. Works with any provider.
  categories:
    - observability
    - troubleshooting
  keywords:
    - pods
    - logs
    - events
    - describe
    - kubernetes
  homepage: https://github.com/openeverest/plugin-inspector
  sourceRepo: https://github.com/openeverest/plugin-inspector
  license: Apache-2.0
  maturity: alpha
  maintainers:
    - name: "OpenEverest Team"
      email: "cncf-openeverest-maintainers@lists.cncf.io"
      github: "openeverest"

spec:
  plugin:
    contributes:
      ui: true
      backend: true
      cli: false
    extensionPoints:
      - clusterDetailTab

  compatibility:
    openeverest: ">=2.0.0-dev.4"

  artifacts:
    chart:
      defaultChannel: stable
      channels:
        stable:
          ref: oci://ghcr.io/openeverest/charts/plugin-inspector
          version: "0.1.0"

  install:
    helm:
      releaseName: plugin-inspector
      namespace: everest-system
